name: Triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  paths:
    name: Labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # A name, not `@me`: the token belongs to the Actions bot, and this
          # is the maintainer every path in CODEOWNERS resolves to.
          MAINTAINER: fschrhunt
        run: |
          set -eu
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          add_label() {
            name=$1 color=$2 description=$3
            gh label create "$name" --repo "$REPO" --color "$color" \
              --description "$description" --force
            gh pr edit "$PR" --repo "$REPO" --add-label "$name"
          }
          # `|| true` on every probe: a non-matching grep must read as
          # "no label", not fail the run — the final statement's status is
          # the script's exit code under `set -eu`.
          echo "$files" | grep -Eq '^src/core/|^src/(main|lib)\.rs$' && \
            add_label area:core 1d76db 'Agent, providers, tools, storage, and extensions' || true
          echo "$files" | grep -q '^src/tui/' && \
            add_label area:tui 5319e7 'Terminal interface and rendering' || true
          echo "$files" | grep -Eq '^(sdk/|docs/sdk\.md)' && \
            add_label area:sdk 0e8a16 'The e-sdk package and its docs' || true
          echo "$files" | grep -Eq '^(docs/|README\.md|SECURITY.md|CONTRIBUTING.md|AGENTS.md|CLAUDE.md|LICENSE)' && \
            add_label documentation 0075ca 'Documentation changes' || true
          echo "$files" | grep -q '^benchmarks/' && \
            add_label area:bench d93f0b 'Performance budgets and the benchmark suite' || true
          # area:infra covers the tooling paths: automation, fuzz targets,
          # the dev shim, and test-only changes.
          echo "$files" | grep -Eq '^(\.github/|scripts/|fuzz/|bin/|tests/|x$|rust-toolchain.toml)' && \
            add_label area:infra 6f42c1 'Build, CI, release, or repository automation' || true
          echo "$files" | grep -Eq '^(Cargo.toml|Cargo.lock|\.github/dependabot.yml)' && \
            add_label dependencies 0366d6 'Dependency or toolchain changes' || true
          # `breaking` is never path-derived — no grep can know a wire or
          # persisted contract changed. The author declares it; see
          # docs/extend/compatibility.md.
          echo "$files" | grep -Eq '^(src/core/(api|auth|config|providers|tools|update)/|src/core/session.rs|src/core/resources/packages.rs|install.sh|SECURITY.md)' && \
            add_label security-surface b60205 'Touches a reviewed trust boundary' || true
          # The guides are published to the website and embedded in the binary,
          # and every path in CODEOWNERS resolves to the maintainer, so an
          # outside contribution waits on their review. Hand them the PR as
          # well: an assignment lands in their queue, a review request can sit
          # unread. See docs/README.md for the contract those files must keep.
          association=$(gh api "repos/$REPO/pulls/$PR" --jq '.author_association')
          case "$association" in
            CONTRIBUTOR | FIRST_TIME_CONTRIBUTOR | FIRST_TIMER | NONE)
              gh pr edit "$PR" --repo "$REPO" --add-assignee "$MAINTAINER" ;;
          esac
