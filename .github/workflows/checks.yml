name: Tests

# Rust checks, terminal frames, packaging, and docs share the local ./x commands.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# Read-only by default; no job in this repo needs write access to anything.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Preserve required job names so existing PR results remain valid.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}
      packages: ${{ steps.filter.outputs.packages }}
      channels: ${{ steps.filter.outputs.channels }}
      docs: ${{ steps.filter.outputs.docs }}
      lock: ${{ steps.filter.outputs.lock }}
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/changes.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Check changed content
        run: python3 scripts/hooks/check.py HEAD^
      - name: Format
        run: ./x fmt --check
      - name: Guard and tooling tests
        run: ./x guard
      - name: Rust cache
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Clippy
        if: needs.changes.outputs.build == 'true'
        run: ./x lint

  unit:
    # The suite, on both supported platforms. `./x test` runs every test binary
    # even after one fails, so a red pull request reports all of them.
    name: unit (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Test
        if: needs.changes.outputs.build == 'true'
        run: ./x test

  e2e:
    # The frames and colours are pinned against the reference design, which no
    # other job looks at.
    name: Terminal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Frames
        if: needs.changes.outputs.build == 'true'
        run: ./x ui --out "$RUNNER_TEMP/e-ui-frames"

      - name: Retain frames
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-frames-${{ runner.os }}
          path: ${{ runner.temp }}/e-ui-frames
          if-no-files-found: ignore
          retention-days: 7

  docs:
    # The guides are published on the website and embedded in the binary. A
    # change to the binary gets the contract from `./x test`; a prose-only
    # change, which skips that, gets it here.
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.build != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Docs contract
        if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.build != 'true'
        run: ./x docs

  packages:
    name: Packages - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust cache
        if: matrix.name == 'linux' && (needs.changes.outputs.build == 'true' || needs.changes.outputs.packages == 'true')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - if: needs.changes.outputs.packages == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - if: needs.changes.outputs.packages == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Package contents and native launchers
        if: needs.changes.outputs.packages == 'true'
        run: ./x packages

      - name: Published crates
        if: matrix.name == 'linux' && needs.changes.outputs.build == 'true'
        run: ./x crates
      - name: Release SBOM
        if: matrix.name == 'linux' && (needs.changes.outputs.build == 'true' || needs.changes.outputs.packages == 'true')
        run: ./x sbom "$RUNNER_TEMP/e-sbom.cdx.json"

  channels:
    name: Channels
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.channels == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Reference channels
        run: ./x channels

      - name: Build the Slack image
        run: ./x container

  glibc:
    # The release's Linux image, so the floor is proven on the pull request
    # instead of by a user on an older distribution. Release plumbing and the
    # lockfile both decide it, because a dependency can raise the floor.
    name: glibc compatibility
    needs: changes
    if: needs.changes.outputs.packages == 'true' || needs.changes.outputs.lock == 'true'
    runs-on: ubuntu-latest
    container:
      image: rust:1.98-bullseye
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/*/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-bullseye-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-bullseye-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Build for the oldest glibc the release promises
        env:
          TARGETS: x86_64-unknown-linux-gnu
          E_GLIBC_CEILING: "2.31"
        run: scripts/release/build.sh

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.build == 'true') || (github.event_name == 'pull_request' && needs.changes.outputs.bench == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Bench
        run: ./x bench

      # A reviewer convenience, not a contract: GitHub's artifact service
      # occasionally 403s at finalize, and that flake must not fail the job.
      - name: Upload binary
        if: github.event_name == 'pull_request' && needs.changes.outputs.build == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.number }}
          path: target/release/e
          if-no-files-found: error
          retention-days: 7
