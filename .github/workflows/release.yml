name: Release

# A version tag qualifies and builds four release binaries, then publishes
# checksums, an SBOM, and build provenance. install.sh consumes the binaries.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  qualify:
    name: Qualify tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify source, version, and changelog
        run: |
          ./x check
          ./x release-check "${{ github.ref_name }}"

  create:
    name: Draft release
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release notes are the tag's own CHANGELOG section.
          awk -v ver="${TAG#v}" \
            '$0 == "## " ver || $0 ~ "^## " ver " " {hit=1; next} /^## / {hit=0} hit' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/intuitums/e/blob/main/CHANGELOG.md)." > notes.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "**Install or update**"
            echo ""
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/intuitums/e/main/install.sh | sh"
            echo '```'
            echo ""
            echo "After this one manual install, e updates itself (\`e update\`,
            or the launch-time background check; /reload switches to a
            downloaded update in place)."
          } >> notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md

  build:
    name: Build (${{ matrix.runner }})
    needs: create
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - runner: ubuntu-latest
            targets: "x86_64-unknown-linux-gnu"
          - runner: ubuntu-24.04-arm
            targets: "aarch64-unknown-linux-gnu"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and upload each target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
            cargo build --release --locked --target "$target"
            tar czf "e-$target.tar.gz" -C "target/$target/release" e
            gh release upload "$TAG" "e-$target.tar.gz" --clobber
          done

          host=$(rustc -vV | sed -n 's/^host: //p')
          case " ${{ matrix.targets }} " in
            *" $host "*)
              "target/$host/release/e" --version | grep -Fx "e ${TAG#v}"
              sha256sum "e-$host.tar.gz" > checksums.txt 2>/dev/null || \
                shasum -a 256 "e-$host.tar.gz" > checksums.txt
              install_dir=$(mktemp -d)
              E_RELEASE_BASE="file://$PWD" E_INSTALL_DIR="$install_dir" ./install.sh
              "$install_dir/e" --version | grep -Fx "e ${TAG#v}"
              ;;
          esac

  publish:
    name: Checksums and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and checksum every artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern "e-*.tar.gz"
          sha256sum e-*.tar.gz > checksums.txt

      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --spec-version 1.5
          # cargo-cyclonedx names the BOM after the crate (e.cdx.json), not bom.json.
          mv e.cdx.json assets/e-sbom.cdx.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: assets/*

      - name: Upload metadata and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" assets/checksums.txt assets/e-sbom.cdx.json --clobber
          gh release edit "$TAG" --draft=false
