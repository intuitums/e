name: publish

# Production publishes here, beta publishes in e-beta, and dev publishes only to npm.
on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Publish a beta candidate or retry existing release packages
        type: choice
        options: [beta, retry]
        default: beta
      commit:
        description: Beta source commit already on main (defaults to main)
        type: string
      tag:
        description: Existing version tag for a package retry
        type: string

permissions: {}

concurrency:
  group: release-publishing
  queue: max
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    if: github.repository == 'intuitums/e' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    permissions:
      # GitHub requires push access to inspect unpublished draft releases.
      contents: write
      # Stable promotion reads the selected beta's verified deployment.
      deployments: read
    outputs:
      repository: ${{ steps.release.outputs.repository }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      title: ${{ steps.release.outputs.title }}
      channel: ${{ steps.release.outputs.channel }}
      command: ${{ steps.release.outputs.command }}
      sha: ${{ steps.release.outputs.sha }}
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check beta publishing access
        if: inputs.action == 'beta' || contains(inputs.tag, '-beta.')
        env:
          BETA_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
        run: test -n "$BETA_TOKEN" || { echo 'Configure BETA_RELEASE_TOKEN with Contents read/write on intuitums/e-beta.'; exit 1; }
      - id: release
        env:
          GH_TOKEN: ${{ contains(inputs.tag, '-beta.') && secrets.BETA_RELEASE_TOKEN || github.token }}
        run: python3 scripts/release/resolve.py
  qualify:
    needs: resolve
    if: needs.resolve.outputs.mode == 'build'
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report dev build
        if: needs.resolve.outputs.channel == 'dev'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOBS: ${{ toJSON(needs) }}
          REPORT_STAGE: building
        run: python3 scripts/release/pr_comment.py
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check selected source
        # Dev already passed the Tests workflow at this exact commit.
        if: github.event_name != 'workflow_run'
        run: |
          ./x check
          ./x ui

      - name: Verify release identity
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          E_BUILD_CHANNEL="$CHANNEL" ./x release-check "$TAG"

  create:
    name: draft
    needs: [resolve, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Draft
        if: needs.resolve.outputs.channel != 'dev'
        env:
          TITLE: ${{ needs.resolve.outputs.title }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ needs.resolve.outputs.channel == 'beta' && secrets.BETA_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if [ "$CHANNEL" = production ]; then
            ./scripts/release-notes.sh "$TAG" < CHANGELOG.md > notes.md
          else
            test -n "$GH_TOKEN" || { echo 'Configure BETA_RELEASE_TOKEN for intuitums/e-beta.'; exit 1; }
            printf 'Source: https://github.com/intuitums/e/commit/%s\n\nBeta build %s.\n' "$SHA" "$TAG" > notes.md
          fi
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'Release is already published; use action=retry to retry packages without rebuilding.'; exit 1; }
          else
            if [ "$CHANNEL" = production ]; then
              gh release create "$TAG" --draft --target "$SHA" --title "$TITLE" --notes-file notes.md
            else
              gh release create "$TAG" --draft --title "$TITLE" --notes-file notes.md
            fi
          fi

  build:
    name: build (macos)
    needs: [resolve, create]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/*/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Build
        env:
          E_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          E_BUILD_CHANNEL: ${{ needs.resolve.outputs.channel }}
          E_BUILD_COMMIT: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ needs.resolve.outputs.channel == 'beta' && secrets.BETA_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          # A macOS runner's libc is not a Linux floor; scripts/release/build.sh
          # checks the glibc ceiling on the Linux legs instead.
          TARGETS: aarch64-apple-darwin x86_64-apple-darwin
          COMMAND: ${{ needs.resolve.outputs.command }}
        run: scripts/release/build.sh

      - name: Retain build archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-macos
          path: e-*.tar.gz
          retention-days: 14
          overwrite: true

  build-linux:
    name: build (${{ matrix.leg }})
    needs: [resolve, create]
    runs-on: ${{ matrix.runner }}
    # A Linux binary links against the glibc of the image that built it, so it
    # is built where that glibc is oldest: Debian 11 ships 2.31, which covers
    # Debian 11 and 12, Ubuntu 22.04 and 24.04, and RHEL 9. Building on
    # `ubuntu-latest` instead put the floor at that runner's 2.39 and left the
    # older half of our users with a binary that would not start.
    container:
      image: rust:1.98-bullseye
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-x86_64
            runner: ubuntu-latest
            targets: "x86_64-unknown-linux-gnu"
          - leg: linux-arm64
            runner: ubuntu-24.04-arm
            targets: "aarch64-unknown-linux-gnu"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/*/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-bullseye-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-bullseye-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Build
        env:
          E_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          E_BUILD_CHANNEL: ${{ needs.resolve.outputs.channel }}
          E_BUILD_COMMIT: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ needs.resolve.outputs.channel == 'beta' && secrets.BETA_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGETS: ${{ matrix.targets }}
          COMMAND: ${{ needs.resolve.outputs.command }}
          # Debian 11's glibc, and the floor `install.sh` refuses below.
          E_GLIBC_CEILING: "2.31"
        run: scripts/release/build.sh

      - name: Retain build archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.leg }}
          path: e-*.tar.gz
          retention-days: 14
          overwrite: true

  publish:
    name: release
    needs: [resolve, build, build-linux]
    if: ${{ !cancelled() && ((needs.build.result == 'success' && needs.build-linux.result == 'success') || needs.resolve.outputs.mode == 'recover') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep SBOM tooling for older source commits
        run: cp scripts/release/sbom.py "$RUNNER_TEMP/release-sbom.py"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download build archives
        if: needs.resolve.outputs.mode == 'build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Download and checksum every artifact
        env:
          GH_TOKEN: ${{ needs.resolve.outputs.channel == 'beta' && secrets.BETA_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          if [ '${{ needs.resolve.outputs.mode }}' = recover ]; then
            gh release download "$TAG" --pattern "e-*.tar.gz" --dir "$RUNNER_TEMP/release-assets"
          fi
          cd "$RUNNER_TEMP/release-assets"
          test "$(find . -name 'e-*.tar.gz' | wc -l)" -eq 4
          sha256sum e-*.tar.gz > checksums.txt

      - name: Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          python3 "$RUNNER_TEMP/release-sbom.py" "$RUNNER_TEMP/release-assets/e-sbom.cdx.json"

      - name: Record build identity
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 -c 'import json, os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "release-assets", "build.json").write_text(json.dumps({"version": os.environ["VERSION"], "commit": os.environ["SOURCE_COMMIT"]}) + "\n")'

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

      - name: Upload metadata and publish
        if: needs.resolve.outputs.channel != 'dev'
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ needs.resolve.outputs.channel == 'beta' && secrets.BETA_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/release-assets/checksums.txt" "$RUNNER_TEMP/release-assets/e-sbom.cdx.json" --clobber
          if [ "$CHANNEL" = production ]; then
            ./scripts/release-notes.sh "$TAG" < CHANGELOG.md > notes.md
            python3 scripts/release/notes.py notes.md "$TAG" "$SHA" > "$RUNNER_TEMP/release-assets/release.json"
            gh release upload "$TAG" "$RUNNER_TEMP/release-assets/release.json" --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            printf '%s\n' "$TAG" > "$RUNNER_TEMP/release-assets/version.txt"
            gh release upload "$TAG" "$RUNNER_TEMP/release-assets/version.txt" --clobber
            gh release edit "$TAG" --draft=false --latest=false
          fi

      - name: Retain verified assets for package publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-assets
          path: ${{ runner.temp }}/release-assets/*
          retention-days: 14
          overwrite: true

  npm:
    name: npm
    needs: [resolve, publish]
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.resolve.outputs.mode == 'retry') }}
    runs-on: ubuntu-latest
    # Six packages may each need up to twenty minutes for npm processing.
    timeout-minutes: 110
    outputs:
      failure: ${{ steps.packages.outputs.failure }}
      cleanup: ${{ steps.cleanup.outcome }}
      verify: ${{ steps.verify.outcome }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Report dev publication
        if: needs.resolve.outputs.channel == 'dev'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOBS: ${{ toJSON(needs) }}
          REPORT_STAGE: publishing
        run: python3 scripts/release/pr_comment.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download verified assets
        if: needs.resolve.outputs.mode != 'retry'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-assets
          path: ${{ runner.temp }}/npm-assets
      - name: Prepare verified packages
        env:
          GH_TOKEN: ${{ needs.resolve.outputs.channel == 'beta' && secrets.BETA_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if [ '${{ needs.resolve.outputs.mode }}' = retry ]; then
            test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
            gh release download "$TAG" --pattern 'e-*.tar.gz' --pattern checksums.txt --dir "$RUNNER_TEMP/npm-assets"
          fi
          python3 scripts/packaging/prepare.py "$TAG" "$RUNNER_TEMP/npm-assets" dist
      - name: Publish and verify npm packages
        id: packages
        env:
          # Remove this secret after all application packages and the Slack bot trust this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: node scripts/packaging/publish-npm.mjs dist --exclude=slack
      - name: Publish the Slack channel
        # The bot versions itself and publishes with production only. A bot publication
        # failure does not block the application's installers or their retries.
        if: needs.resolve.outputs.channel == 'production'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: node scripts/packaging/publish-npm.mjs dist --only=slack
      - name: Keep preview packages off latest
        id: cleanup
        if: needs.resolve.outputs.channel != 'production'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # npm may assign latest on a package's first publication despite --tag.
          for package in dist/*/package.json; do
            name=$(node -p 'require("./" + process.argv[1]).name' "$package")
            latest=$(npm dist-tag ls "$name" | sed -n 's/^latest: //p')
            if [ "$latest" = "$VERSION" ]; then
              npm dist-tag rm "$name" latest
            fi
          done

      - name: Verify registry installation
        id: verify
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMAND: ${{ needs.resolve.outputs.command }}
        run: sh scripts/packaging/verify-npm.sh

  container:
    name: container
    # The image installs the release it belongs to, so it waits for one. Dev
    # builds are npm-only and the installer has no dev channel.
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.resolve.outputs.channel != 'dev' }}
    # A registry hiccup must not fail the release, the way the channel package's
    # publishing step does not. The deployment report still records the outcome.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: channels/slack
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            E_CHANNEL=${{ needs.resolve.outputs.channel }}
            E_VERSION=${{ needs.resolve.outputs.version }}
          tags: |
            ghcr.io/intuitums/e-slack:${{ needs.resolve.outputs.channel == 'production' && 'latest' || needs.resolve.outputs.channel }}
            ghcr.io/intuitums/e-slack:${{ needs.resolve.outputs.version }}

  crates:
    name: crates.io
    # The application's version is the release version, so previews stay on npm.
    # Core publishes first: the frontends and SDK pin its version.
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.resolve.outputs.channel == 'production' }}
    # Like the npm and image publications, a registry hiccup must not fail the
    # release; the deployment report still records the outcome.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'Configure CARGO_REGISTRY_TOKEN to publish the crates.'; exit 1; }

          # The SDK versions itself; only the application follows the release.
          SDK_VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('crates/sdk/Cargo.toml','rb'))['package']['version'])")

          published() {
            curl -fsS -o /dev/null "https://crates.io/api/v1/crates/$1/$2"
          }
          # crates.io serves a new version to the index asynchronously, and a
          # crate cannot resolve a dependency until that version is visible.
          await_index() {
            for _ in $(seq 1 60); do
              published "$1" "$2" && return 0
              sleep 10
            done
            return 1
          }

          # The application crates share the release version and publish in
          # dependency order: core, then its frontends, then the binary. A
          # retry after a partial publish finds a version already there.
          for crate in intuitums-e-core intuitums-e-tui intuitums-e-rpc intuitums-e; do
            if published "$crate" "$VERSION"; then
              echo "$crate $VERSION is already published"
            else
              cargo publish --locked -p "$crate"
              await_index "$crate" "$VERSION" || { echo "$crate never reached the index"; exit 1; }
            fi
          done

          if published intuitums-e-sdk "$SDK_VERSION"; then
            echo "intuitums-e-sdk $SDK_VERSION is already published"
          else
            # Not --locked: packaging the SDK resolves its dependency from the
            # registry rather than from this workspace.
            cargo publish -p intuitums-e-sdk
          fi

  homebrew:
    name: homebrew
    permissions:
      contents: read
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.resolve.outputs.channel != 'dev' && (needs.publish.result == 'success' || needs.resolve.outputs.mode == 'retry') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Prepare verified formula
        env:
          GH_TOKEN: ${{ needs.resolve.outputs.channel == 'beta' && secrets.BETA_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
          gh release download "$TAG" --pattern 'e-*.tar.gz' --pattern checksums.txt --dir "$RUNNER_TEMP/brew-assets"
          python3 scripts/packaging/prepare.py "$TAG" "$RUNNER_TEMP/brew-assets" dist
      - name: Check publishing access
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN" || { echo 'Configure HOMEBREW_TAP_TOKEN before publishing.'; exit 1; }
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: intuitums/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Publish formula
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: scripts/packaging/publish-brew.sh "dist/${{ needs.resolve.outputs.command }}.rb" tap

  channel:
    name: channel
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.resolve.outputs.channel != 'dev' && (needs.publish.result == 'success' || needs.resolve.outputs.mode == 'retry') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify pinned website installer
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          COMMAND: ${{ needs.resolve.outputs.command }}
        run: |
          curl -fsSL --retry 3 https://e.intuitum.sh/install.sh -o "$RUNNER_TEMP/install.sh"
          E_INSTALL_DIR="$RUNNER_TEMP/e-pinned" sh "$RUNNER_TEMP/install.sh" --channel "$CHANNEL" --version "${TAG#v}"
          "$RUNNER_TEMP/e-pinned/$COMMAND" --version | grep -Fx "e ${TAG#v}"
      - name: Advance channel
        env:
          GH_TOKEN: ${{ needs.resolve.outputs.channel == 'beta' && secrets.BETA_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: python3 scripts/release/channel.py "$TAG"
      - name: Verify current website installer
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          COMMAND: ${{ needs.resolve.outputs.command }}
        run: |
          E_INSTALL_DIR="$RUNNER_TEMP/e-current" sh "$RUNNER_TEMP/install.sh" --channel "$CHANNEL"
          "$RUNNER_TEMP/e-current/$COMMAND" --version

  deployment:
    name: report
    needs: [resolve, qualify, create, build, build-linux, publish, npm, homebrew, container, crates, channel]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      # Reporting uses this workflow's code, while the deployment records the selected release SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record channel outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOBS: ${{ toJSON(needs) }}
        run: python3 scripts/release/deployment.py
      - name: Update dev PR outcome
        if: always() && needs.resolve.outputs.channel == 'dev'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOBS: ${{ toJSON(needs) }}
          REPORT_STAGE: finished
        run: python3 scripts/release/pr_comment.py
