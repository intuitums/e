name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; no job in this repo needs write access to anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Audit the security surface before running the repository contract.
    name: Guard (security surface)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit the security surface
        run: ./scripts/guard.sh

  test:
    # Run the repository contract on fresh GitHub-hosted Linux and macOS VMs.
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustc --version

      - name: Repository contract
        run: ./x check

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustc --version

      - name: Measure release binary
        run: ./x bench

      # A reviewer convenience, not a contract: GitHub's artifact service
      # occasionally 403s at finalize, and that flake must not fail the job.
      - name: Upload pull-request binary
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.number }}
          path: target/release/e
          if-no-files-found: error
          retention-days: 7
