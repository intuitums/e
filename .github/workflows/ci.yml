name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; no job in this repo needs write access to anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Cheap and trust-sensitive; stays on GitHub-hosted.
    name: Guard (security surface)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit the security surface
        run: ./scripts/guard.sh

  test:
    # Linux leg runs on the self-hosted runner in the intuitum fleet naming
    # scheme (Blacksmith-style): 24-core Ubuntu 26.04 box, systemd service
    # actions.runner.intuitums-e.intuitum-24vcpu-ubuntu-2604-01, user `anvil`.
    # Fork PRs are held for approval by GitHub's external-contributor gate and
    # must never be approved onto it; macOS stays GitHub-hosted.
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [intuitum-24vcpu-ubuntu-2604-01, macos-latest]
    # checkout's default `clean: true` runs git clean -ffdx, which wipes
    # target/ every run; on a persistent self-hosted box we keep it so cargo
    # rebuilds incrementally.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Rust toolchain
        run: rustc --version

      - name: Repository contract
        run: ./x check

  performance:
    name: Performance budgets
    runs-on: intuitum-24vcpu-ubuntu-2604-01
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Rust toolchain
        run: rustc --version

      - name: Measure release binary
        run: ./x bench

      - name: Upload pull-request binary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.number }}
          path: target/release/e
          if-no-files-found: error
          retention-days: 7
