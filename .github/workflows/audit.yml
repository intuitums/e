name: Audit

# Dependency advisories (RustSec). Runs when the dependency set changes and
# weekly, so a CVE in an existing pin still surfaces without a PR.
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
