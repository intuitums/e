name: Bug
description: Something is broken or incorrect
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Be specific. Include error messages if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `e --version`, and your OS.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste `e doctor --no-network` output. It is redacted by design; review it before submitting.
      render: shell
    validations:
      required: false
