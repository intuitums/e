[package]
name = "e-sdk"
# The SDK's own version, independent of the application version. It stays
# 0.0.0 until the first release declares the semantic-versioning policy.
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "Programmatic access to e's coding-agent core"
publish = false

# The path dependency is the edge to the library target the facade consumes.
[dependencies]
e = { path = ".." }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
