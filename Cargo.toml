[package]
name = "e"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "A TUI for coding agents"

[lib]
name = "e"
path = "src/lib.rs"

[[bin]]
name = "e"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
unicode-width = "0.2"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "signal"] }
futures = "0.3"
pulldown-cmark = { version = "0.12", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
