[package]
name = "e"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A TUI for coding agents"

[lib]
name = "e"
path = "src/lib.rs"

[[bin]]
name = "e"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
unicode-width = "0.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "io-util", "process", "signal"] }
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
regex = "1"
libc = "0.2"

# Half the binary for zero runtime cost (measured: 8.02 -> 4.32 MiB, speed
# unchanged). panic=abort skips unwinding; the TUI's panic hook restores the
# terminal explicitly, so nothing relies on Drop during a panic. Release
# builds slow to ~25s — dev builds are untouched.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
